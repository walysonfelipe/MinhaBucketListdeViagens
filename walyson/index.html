<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Bucket List de Viagens</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

  <header class="bg-primary text-white py-4 mb-4">
    <div class="container">
      <img
        class="logo-mblv"
        src="mblv.png"
        alt="MBLV - Minha Bucket List de Viagens"
      >
    </div>
  </header>

  <main class="container pb-5">

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Cadastrar viagem</h2>

        <form id="formViagem">

          <div class="row g-3">

            <div class="col-md-6">
              <label for="pais" class="form-label">País / destino</label>
              <input
                type="text"
                class="form-control"
                id="pais"
                placeholder="Ex.: Japão"
              >
            </div>

            <div class="col-md-6">
              <label for="foto" class="form-label">Link da foto</label>
              <input
                type="url"
                class="form-control"
                id="foto"
                placeholder="https://..."
              >
            </div>

            <div class="col-md-4">
              <label for="dataViagem" class="form-label">Data prevista</label>
              <input
                type="date"
                class="form-control"
                id="dataViagem"
              >
            </div>

            <div class="col-md-8">
              <label for="descricao" class="form-label">Descrição</label>
              <input
                type="text"
                class="form-control"
                id="descricao"
                placeholder="O que você gostaria de fazer nesta viagem?"
              >
            </div>

            <div class="col-12">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="jaFui"
                >
                <label class="form-check-label" for="jaFui">
                  Já fui para este destino
                </label>
              </div>
            </div>

            <div class="col-12">
              <div id="mensagemErro" class="alert alert-danger d-none mb-0">
                Preencha todos os campos antes de salvar.
              </div>
            </div>

            <div class="col-12 d-flex gap-2">
              <button
                type="button"
                class="btn btn-primary"
                id="btnSalvar"
              >
                Adicionar viagem
              </button>

              <button
                type="button"
                class="btn btn-outline-secondary d-none"
                id="btnCancelar"
              >
                Cancelar edição
              </button>
            </div>

          </div>
        </form>
      </div>
    </section>


    <section class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0">Viagens cadastradas</h2>
          <span class="badge text-bg-secondary" id="contadorViagens">0 viagem(ns)</span>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Foto</th>
                <th>Destino</th>
                <th>Data</th>
                <th>Descrição</th>
                <th>Status</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>

            <tbody id="listaViagens">
              <!-- As viagens deverão ser inseridas aqui pelo JavaScript. -->
              <!--
                MODELO DE UMA VIAGEM — referência para criar a linha no index.js.
                Este exemplo está comentado para a lista começar vazia,
                como esperado pelo corretor. Mantenha-o comentado no HTML.

                Preserve as classes viagem-item, viagem-foto, viagem-pais,
                viagem-data, viagem-descricao, viagem-status, btn-editar
                e btn-excluir nas linhas criadas pelo JavaScript.
                As demais classes abaixo são apenas de apresentação.

                Substitua os dados pelos valores do formulário:
                - A imagem deve ficar dentro de .viagem-foto, com o link em src.
                - A data deve manter o formato AAAA-MM-DD do campo de data.
                - O status deve ser "Quero ir" (desmarcado) ou "Já fui" (marcado).
                - Os botões precisam receber o comportamento pelo JavaScript.

                <tr class="viagem-item">
                  <td class="viagem-foto">
                    <img src="https://example.com/portugal.jpg" alt="Portugal" width="100">
                  </td>
                  <td class="viagem-pais">Portugal</td>
                  <td class="viagem-data">2027-07-15</td>
                  <td class="viagem-descricao">Conhecer Lisboa</td>
                  <td class="viagem-status">Quero ir</td>
                  <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-primary btn-editar">Editar</button>
                    <button type="button" class="btn btn-sm btn-outline-danger btn-excluir">Excluir</button>
                  </td>
                </tr>
              -->
            </tbody>
          </table>
        </div>

        <p id="listaVazia" class="text-muted text-center my-4">
          Nenhuma viagem cadastrada.
        </p>
      </div>
    </section>

  </main>

  <footer class="footer-app">
    Desenvolvido por
    <a href="https://walysonassis.online" target="_blank" rel="noopener noreferrer">
      Walyson Assis
    </a>
  </footer>

  <script src="index.js"></script>
</body>
</html>
